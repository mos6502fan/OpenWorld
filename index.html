<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="css/game.css">
        <title>OpenWorld</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
            body {
                background-color: black;
                margin: 0;
                padding: 0;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                font-family: sans-serif;
            }
            canvas {
                display: block;
                margin: 0 auto;
                box-shadow: 0 0 20px rgba(0,0,0,0.5);
                width: auto;
                height: auto;
                max-width: 100vw;
                max-height: 100vh;
                object-fit: contain;
            }
            #gameCanvas {
                position: relative;
                background: black;
            }
            .loading-message {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
                font-size: 1.2rem;
                background: rgba(0,0,0,0.7);
                padding: 12px 24px;
                border-radius: 30px;
                z-index: 9999;
                font-family: monospace;
                pointer-events: none;
                backdrop-filter: blur(4px);
            }
        </style>
    </head>
    <body>
        <div class="loading-message" id="loadingMessage">Loading OpenWorld...</div>

        <script type="text/javascript">
            window.addEventListener('load', function() {
                setTimeout(function() {
                    var msg = document.getElementById('loadingMessage');
                    if (msg) msg.style.display = 'none';
                }, 800);
            });
            window.addEventListener('error', function(e) {
                console.error('Ошибка загрузки игры:', e);
                var msg = document.getElementById('loadingMessage');
                if (msg) msg.textContent = 'Error! Check console (f12)';
            });
        </script>

        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
